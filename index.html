<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ÚLTIMO INFORMÁTICO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Último Informático">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#game{position:fixed;inset:0}
canvas{display:block;image-rendering:pixelated;touch-action:none}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#7fd4ff;font:700 18px monospace;background:#0b1020}
#rot{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#16244a,#070b18);color:#e8f4ff;font:700 17px monospace;text-align:center;padding:24px}
#rot .ph{width:64px;height:104px;border:5px solid #7fd4ff;border-radius:14px;position:relative;animation:rt 2.4s ease-in-out infinite;box-shadow:0 0 22px #34e6ff66}
#rot .ph:after{content:'';position:absolute;left:50%;bottom:7px;width:18px;height:4px;margin-left:-9px;background:#7fd4ff;border-radius:2px}
@keyframes rt{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot small{font-weight:400;opacity:.7;font-size:13px}
@media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div id="rot"><div class="ph"></div><div>GIRA EL MÓVIL<br><small>ÚLTIMO INFORMÁTICO se juega en horizontal</small></div></div>
<div id="boot">Cargando…</div>
<script src="vendor/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
